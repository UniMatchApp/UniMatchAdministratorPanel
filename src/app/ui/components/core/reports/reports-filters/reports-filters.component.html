<div class="reports-filters">
  <div class="filter-date">
    <p>Filter by date</p>
    <input class="filter-date-box" type="date" />
    <p>to</p>
    <input class="filter-date-box" type="date" />
  </div>
  <div class="filter-type">
    <p>Filter by type</p>
    <select class="filter-type-select" (change)="onFilterTypeChange($event)">
      <option value="ALL">All</option>
      <option value="INAPPROPRIATE_CONTENT">Inappropriate</option>
      <option value="SPAM">Spam</option>
      <option value="HARASSMENT">Abusive</option>
    </select>
  </div>
</div>
