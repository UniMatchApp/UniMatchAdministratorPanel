<div class="dashboard-metric-container">
  <div class="dashboard-metrics">
    <div *ngFor="let metric of metrics; let i = index"
         class="dashboard-metric-unit"
         [ngStyle]="{'background-color': colors[i] + '80'}">
      <p class="dashboard-metric-title">{{ metric.title }}</p>
      <p class="dashboard-metric-value">{{ metric.value }}</p>
    </div>
  </div>
</div>
