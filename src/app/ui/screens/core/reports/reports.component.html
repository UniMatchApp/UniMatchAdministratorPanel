<div class="reports-container">
  <div class="reports-inside-container">
    <div class="reports-lists">
      <app-reports-filters (filterChange)="onFilterTypeChanged($event)"></app-reports-filters>
      <div class="reports-table">
        <app-reports-list [reports]="reportRows"></app-reports-list>
      </div>
    </div>
    <div class="pagination">
      <button
        class="pagination-button"
        (click)="previousPage()"
        [disabled]="currentPage === 1">
        <i>
          <fa-icon [icon]="faArrowLeft"></fa-icon>
        </i>
      </button>
      <span>{{ currentPage }} / {{ totalPages }}</span>
      <button
        class="pagination-button"
        (click)="nextPage()"
        [disabled]="currentPage === totalReports">
        <i>
          <fa-icon [icon]="faArrowRight"></fa-icon>
        </i>
      </button>
    </div>
  </div>
</div>
