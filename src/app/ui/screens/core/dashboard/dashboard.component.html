<div class="dashboard-container">
  <div class="dashboard-inside-container">
    <app-dashboard-metrics [metrics]="metrics"></app-dashboard-metrics>
    <div class="dashboard-lists">
      <app-dashboard-users-stats *ngFor="let stat of stats" [title]="stat.title" [image]="stat.image" [table]="stat.table" [columns]="stat.columns"></app-dashboard-users-stats>
    </div>
  </div>
</div>
