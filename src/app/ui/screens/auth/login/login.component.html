<div class="login-container">
  <div class="login-inside-container">
    <img src="/assets/img/logo_unimatch.png"
         alt="Unimatch user manager" class="logo">

    <h1>
      <span class="login-text">Login</span>
      <span class="account-text"> your account</span>
    </h1>

    <form (ngSubmit)="onLogin()" class="login-fields">
      <div class="email-input">
        <label for="email">Email</label>
        <input type="text" id="email" [(ngModel)]="email" name="email" placeholder="Enter email" required>
      </div>

      <div class="password-input">
        <label for="password">Password</label>
        <div class="password-container">
          <input [type]="passwordVisible ? 'text' : 'password'"
                 id="password"
                 [(ngModel)]="password"
                 name="password"
                 placeholder="Enter password"
                 required>
          <button type="button" class="toggle-password" (click)="togglePasswordVisibility()">
            <i class="fa" [ngClass]="passwordVisible ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
      </div>
      <button type="submit">Log in</button>
    </form>
  </div>
</div>
